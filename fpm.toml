name = "pic-mpi"
version = "0.4.0"
license = "MIT"
author = "JorgeG94"
maintainer = "jorgegalvez1694@gmail.com"
copyright = "Copyright 2024, JorgeG94"
[preprocess]
[preprocess.cpp]
suffixes = ["F90"]
# Backend selection for fpm.  fpm resolves `#if defined(USE_SERIAL)` in
# pic_mpi_lib.F90 while building the DEPENDENCY GRAPH, so a compiler-only
# `--flag -DUSE_SERIAL` comes too late -- fpm would schedule the mpi_f08
# backend and never compile src/serial/pic_mpi_serial.F90 at all.  A feature
# sets the macro early enough, and a consumer can opt in with
# `pic-mpi = { git = "...", features = ["serial"] }`.  Default (no feature)
# stays MPI, matching the CMake default.
[features]
serial.preprocess.cpp.macros = ["USE_SERIAL"]

[library]
source-dir = "src"
[build]
auto-executables = false
auto-tests = false
#auto-examples = true
module-naming = false
# mpi_f08 and mpi back the two MPI backends (compiled out under -DUSE_SERIAL);
# nvtx is pic's optional profiler hook (compiled out unless -DPIC_USE_NVTX).
# None of them is provided by an fpm package, so declare them external to keep
# fpm from looking for a source that defines them.
external-modules = ["mpi_f08", "mpi", "nvtx"]
[install]
library = true

# All tests are MPI programs except test_serial, which is also the only one
# that builds under --flag -DUSE_SERIAL. The MPI ones are exercised via CMake
# and ctest, where mpirun is available.
[[test]]
name = "test_serial"
source-dir = "test"
main = "test_serial.f90"

[fortran]
implicit-typing = true
implicit-external = true
source-form = "free"

[dependencies]
#openmp = "*"
#mpi = "*"
#test-drive.git = "https://github.com/fortran-lang/test-drive"
pic = { git = "https://github.com/JorgeG94/pic.git", branch = "main"}

[extra.fortitude.check]
select = ["C", "E", "S"]
ignore = ["C003"]
line-length = 132
per-file-ignores = { "pic_mpi.F90" = ["C072"], "pic_mpi_legacy.F90" = ["C072"]}
