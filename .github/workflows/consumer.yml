name: Consumed via FetchContent

#
# What this job protects.
#
# Everything here is invisible in a standalone build, because there
# CMAKE_BINARY_DIR and PROJECT_BINARY_DIR are the same directory. Pulled in
# with FetchContent they are not: CMAKE_BINARY_DIR is the CONSUMER's top-level
# build tree. A library that names it writes its .mod files into the consumer's
# module directory -- where they collide with the consumer's own, and where a
# consumer compiles against them only by accident, because they happened to
# land somewhere it already looks.
#
# pic-mpi, pic and pic-blas all carried that bug. The fix is to write modules
# to PROJECT_BINARY_DIR and export the directory as a BUILD_INTERFACE include,
# so a consumer that merely links the target gets it for free -- and so moving
# the modules later is not a breaking change.
#
# tools/fetchcontent-consumer/ is the whole test: a project that links `pic-mpi`
# and names no include path at all.
#
# PIC_ENABLE_MPI=OFF so this job needs a Fortran compiler and nothing else.
# The backend does not change where the modules go, which is what is under test.
#

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  consumer:
    name: a downstream project can compile against pic-mpi
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: pic-mpi

      - name: Setup Fortran compiler
        uses: fortran-lang/setup-fortran@v1.9.0
        with:
          compiler: gcc
          version: 14

      - name: Configure the consumer
        run: >-
          cmake -S pic-mpi/tools/fetchcontent-consumer -B build
          -DCMAKE_BUILD_TYPE=Release
          -DPIC_ENABLE_MPI=OFF
          -DPIC_MPI_SOURCE_DIR="$GITHUB_WORKSPACE/pic-mpi"

      #
      # Between configure and build, which is the window the bug lives in.
      # Fortran_MODULE_DIRECTORY is not created until build time on some CMake
      # versions, and CMake refuses to generate against an interface include
      # directory that does not exist -- so a consumer on such a version cannot
      # configure at all, while one on a version that pre-creates it never
      # notices. Asserting it here makes the invariant pic-mpi actually relies
      # on explicit, instead of leaving it to whichever CMake the runner has.
      #
      - name: pic-mpi's exported module directory exists at configure time
        run: |
          set -eu
          dir=build/_deps/pic-mpi-build/modules
          if [ ! -d "$dir" ]; then
            echo "::error::$dir does not exist after configure."
            echo "The BUILD_INTERFACE include pic-mpi exports points at it, so a"
            echo "consumer on a CMake that does not pre-create it cannot generate."
            exit 1
          fi
          echo "exists: $dir"

      # Two cores is what a runner has.
      - name: Build the consumer
        run: cmake --build build --parallel 2

      - name: Show the failure verbosely
        if: failure()
        run: cmake --build build --verbose --parallel 1

      #
      # The build above can pass for the wrong reason: if pic-mpi writes into
      # the consumer's module directory, the consumer finds the .mod there.
      # So assert the modules are in pic-mpi's OWN build tree.
      #
      - name: pic-mpi keeps its modules in its own build tree
        run: |
          set -eu
          stray=$(find build/modules -name 'pic_mpi*.mod' 2>/dev/null || true)
          if [ -n "$stray" ]; then
            echo "::error::pic-mpi wrote modules into the consumer's module directory:"
            echo "$stray"
            exit 1
          fi
          own=build/_deps/pic-mpi-build/modules
          for mod in pic_mpi_lib.mod; do
            if [ ! -f "$own/$mod" ]; then
              echo "::error::expected $own/$mod"
              find build -name 'pic_mpi*.mod' || true
              exit 1
            fi
          done
          echo "modules are where they belong:"
          find "$own" -name '*.mod'

      #
      # The install side of the same mistake: `install(DIRECTORY ...)` naming
      # CMAKE_BINARY_DIR installs the CONSUMER's modules as pic-mpi's own.
      #
      - name: Installing from a consumer tree installs only pic-mpi's modules
        run: |
          set -eu
          cmake --install build --prefix prefix > /dev/null
          echo "installed under include/pic-mpi:"
          ls prefix/include/pic-mpi
          for mod in prefix/include/pic-mpi/*.mod; do
            case "$(basename "$mod")" in
              pic_mpi_lib.mod|pic_mpi_f08.mod|pic_mpi_serial.mod) ;;
              *)
                echo "::error::$mod is not pic-mpi's to install"
                exit 1
                ;;
            esac
          done
