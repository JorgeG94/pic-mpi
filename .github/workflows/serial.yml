name: Serial (no MPI)

# What this job protects, and why it installs nothing.
#
# PIC_ENABLE_MPI=OFF exists so that a machine WITHOUT MPI can build pic-mpi.
# A job that installs an MPI and then passes `OFF` would compile the same
# sources but prove nothing about that claim -- the interesting failure is a
# `find_package(MPI)` or a stray `use mpi_f08` that only bites where no MPI is
# present.
#
# So this job installs a Fortran compiler and nothing else. If the serial
# backend ever reaches for MPI again, the configure fails here and nowhere
# else.

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  serial:
    name: build and test without MPI
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        toolchain:
          - {compiler: gcc, version: 13}
          - {compiler: gcc, version: 14}
          - {compiler: gcc, version: 15}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Fortran compiler
        uses: fortran-lang/setup-fortran@v1.9.0
        with:
          compiler: ${{ matrix.toolchain.compiler }}
          version: ${{ matrix.toolchain.version }}

      # Deliberately no MPI here. See the header.
      - name: Confirm there is no MPI to find
        run: |
          if command -v mpif90 >/dev/null 2>&1; then
            echo "::warning::mpif90 is on PATH; this job is less meaningful"
            mpif90 --version | head -1
          else
            echo "no mpif90 on PATH, which is the point"
          fi

      - name: Configure
        run: >-
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Release
          -DPIC_ENABLE_MPI=OFF
          -DENABLE_TESTING=ON
          -DPMPI_BUILD_STANDALONE=ON

      # Two cores is what a runner has.
      - name: Build
        run: cmake --build build --parallel 2

      - name: Show the failure verbosely
        if: failure()
        run: cmake --build build --verbose --parallel 1

      #
      # `-R test_serial`: the rest of the suite is pic's own, pulled in as a
      # dependency, and is not what this job is about.
      #
      # The test runs directly rather than under `mpirun` -- there is nothing
      # to launch it with, which is the whole configuration.
      #
      - name: Test the single-rank backend
        run: >-
          ctest --test-dir build -R test_serial
          --output-on-failure --no-tests=error

  #
  # The same claim as the CMake job above, but for fpm: the `serial` FEATURE
  # (fpm.toml `[features]`) defines USE_SERIAL, so every MPI-only source
  # becomes an empty translation unit and the build needs no MPI here.
  #
  # It must be a feature, not `--flag -DUSE_SERIAL`.  fpm resolves the
  # `#if defined(USE_SERIAL)` in pic_mpi_lib.F90 while building the DEPENDENCY
  # GRAPH; `--flag` only reaches the compiler, after that graph is fixed, so
  # fpm schedules the mpi_f08 backend and may never compile
  # src/serial/pic_mpi_serial.F90 at all.  A feature is declared in the
  # manifest, so it lands early enough to steer the graph.
  #
  # This is also what lets a CONSUMER select the backend -- `--flag` does NOT
  # reach a dependency's graph resolution, but a feature does:
  #     pic-mpi = { git = "...", features = ["serial"] }
  # Default (no feature) stays MPI, matching the CMake default, so a consumer
  # that says nothing does not silently get a single-rank library.
  #
  fpm-serial:
    name: fpm build and test without MPI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Fortran compiler
        uses: fortran-lang/setup-fortran@v1.9.0
        with:
          compiler: gcc
          version: 14

      # setup-fpm@v5 cannot fetch current fpm releases: they only ship
      # gcc-suffixed assets (fpm-X.Y.Z-linux-x86_64-gcc-12) and v5 has no
      # suffix fallback.
      #
      # v0.13.0, NOT v0.12.0.  The old pin existed because v0.12.0's scanner
      # happened to order pic_mpi_lib.F90 after the conditionally compiled
      # pic_mpi_serial.F90 -- luck, not contract, and v0.13.0 does not repeat
      # it.  The `serial` feature removes the dependence on that ordering
      # entirely (the macro is known before the graph is built), and
      # `[features]` needs v0.13.0 anyway.
      - name: Install fpm
        run: |
          url=https://github.com/fortran-lang/fpm/releases/download/v0.13.0/fpm-0.13.0-linux-x86_64-gcc-12
          mkdir -p "$RUNNER_TEMP/fpm-bin"
          curl -sSfL "$url" -o "$RUNNER_TEMP/fpm-bin/fpm"
          chmod +x "$RUNNER_TEMP/fpm-bin/fpm"
          echo "$RUNNER_TEMP/fpm-bin" >> "$GITHUB_PATH"

      # Deliberately no MPI here, same as the CMake serial job.
      - name: Build the library without MPI
        run: fpm build --features serial

      - name: Test the single-rank backend
        run: fpm test --features serial test_serial

  #
  # The serial backend's signatures are generated from mpi_f08's so the two
  # cannot drift. If someone adds a procedure to the MPI backend and not the
  # serial one, a consumer's generic stops resolving in a build nobody here
  # runs -- so the check belongs in CI rather than in a reviewer's memory.
  #
  in-step:
    name: serial backend matches the MPI one
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Compare the two interfaces
        run: python3 tools/check_serial_in_step.py
