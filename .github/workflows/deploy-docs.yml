name: Deploy FORD docs

on:
  push:
    branches:
      - main

# The built site is handed to GitHub Pages as an artifact instead of being
# committed to a branch.
#
# FORD rewrites every file in the site on every run, so each deploy used to add
# a fresh copy of the whole site to the gh-pages-docs branch. A plain `git clone`
# fetches every branch, so anyone cloning pic-mpi paid for all of those copies on
# top of the source they actually wanted -- in pic the same setup had taken the
# repository to ~90 MB against 25 MB of real history. Pages storage is not git,
# so nothing published here reaches a clone.
permissions:
  contents: read
  pages: write
  id-token: write

# Only one Pages deployment at a time, and never cancel one that is already
# running: deploy-pages publishes to the live site, so a cancelled run can
# leave the deployment half-finished. Pushes that arrive while one is in
# flight queue instead, and only the newest of them runs.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: 3.12

      - name: Install FORD
        run: pip install ford

      - name: Pip install graphviz
        run: pip install graphviz==0.20.1

      - name: Install c++ graphviz backend
        run: sudo apt install graphviz

      - name: Build FORD docs
        run: ford ford.md

      - name: Upload the site as a Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./docs/fpm-ford

  deploy:
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
